site_name: Car API
site_description: Uma API REST completa para gerenciamento de carros e usuários
site_author: Felipe

theme: 
  name: material
  palette:
    primary: teal
  font:
    text: Roboto

nav:
  - Início: index.md
  - Pré-requisitos: prerequisites.md
  - Instalação: installation.md
  - Configuração: configuration.md
  - Guidelines e padrões: guidelines.md
  - Estrutura do Projeto: structure.md
  - Modelagem do Sistema: modeling.md
  - API Endpoints: endpoints.md
  - Autenticação e Segurança: authentication.md
  - Desenvolvimento: development.md
  - Testes: testing.md
  - Deploy: deployment.md
  - Contribuição: contribution.md
  - Release Notes: release_notes.md

plugins:
  - search

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid